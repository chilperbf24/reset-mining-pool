# RESET pool — calculation registry Worker.
# Template: fill in the D1 database_id after `wrangler d1 create`
# (see README.md in this directory for the full deploy runbook).
# NO secrets live in this file — the operator lookup key is a Worker
# secret:  wrangler secret put REGISTRY_KEY
name = "reset-pool-registry"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Public constants, not secrets: the pool address is embedded in the exit
# statement members sign (POST /exit). src/index.js falls back to the same
# value when the var is absent.
[vars]
POOL_ADDRESS = "4150cf82f0189371818a22d5f5b10d52aadf9108c78020cc97fc002df6eaaca6"

[[d1_databases]]
binding = "REGISTRY_DB"
database_name = "reset-pool-registry"
database_id = "e60a4aa2-28d4-4b7e-a887-b971824d35f6"
